# 테스트 전용 프로파일. datasource.username/password는 application.properties의
# 기본값(${DB_USERNAME:postgres} / ${DB_PASSWORD})을 그대로 상속한다 — 여기 다시 적지 않는다.
# 로컬에서 ./mvnw test를 돌리려면 DB_PASSWORD 환경변수를 설정해야 한다.
spring.datasource.url=jdbc:postgresql://localhost:5432/todolist_test

# 테스트마다 스키마를 새로 만들고 종료 시 정리한다.
spring.jpa.hibernate.ddl-auto=create-drop
