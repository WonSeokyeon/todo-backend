spring.application.name=todo-backend

# 기본 프로파일은 local 이다. 배포 환경에서는 SPRING_PROFILES_ACTIVE 로 덮어쓴다.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# --- Database (PostgreSQL) ---
# 접속 정보는 프로파일별 파일 또는 환경변수로 주입한다. (CLAUDE.md 절대규칙 9)
# todolist_db 는 스키마가 아니라 독립 데이터베이스다. (CLAUDE.md 절대규칙 2)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/todolist_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate=info
logging.level.org.hibernate.SQL=debug

# --- 시간대: 서버/DB 모두 UTC 로 저장한다. (CLAUDE.md 4장) ---
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- JWT (Access Token 서명) ---
jwt.secret=${JWT_SECRET}

# --- CORS ---
# 쉼표 구분 목록. FRONTEND_URL(OAuth2 리다이렉트 단일 URL)과 절대 겸용하지 않는다 (CLAUDE.md 6장).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# --- OAuth2 리다이렉트 기준 URL (단일 URL. CORS_ALLOWED_ORIGINS와 겸용 금지) ---
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# --- Google OAuth2 ---
# client-id/secret은 Google Cloud Console에서 발급받기 전까지 기동 자체가 실패하지
# 않도록 자리표시자 기본값을 둔다("changeme"). 실제 구글 로그인을 쓰려면 반드시
# GOOGLE_CLIENT_ID/GOOGLE_CLIENT_SECRET 환경변수(또는 application-local.properties)로 덮어쓴다.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:changeme}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:changeme}
spring.security.oauth2.client.registration.google.scope=email,profile

# --- Refresh Token 쿠키 ---
# 로컬(localhost:3000 ↔ localhost:8080)은 same-site라 Lax로 충분하다.
# 운영(Amplify ↔ API 도메인)은 cross-site라 None+Secure가 필요하다 — application-prod.properties에서 덮어쓴다.
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

# --- Actuator ---
# 헬스체크만 노출한다. env/beans/heapdump 등이 열리면 내부 정보가 유출된다.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
