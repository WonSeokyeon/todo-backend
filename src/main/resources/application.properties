spring.application.name=todo-backend

# 기본 프로파일은 local 이다. 배포 환경에서는 SPRING_PROFILES_ACTIVE 로 덮어쓴다.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# --- Database (PostgreSQL) ---
# 접속 정보는 프로파일별 파일 또는 환경변수로 주입한다. (CLAUDE.md 절대규칙 9)
# todolist_db 는 스키마가 아니라 독립 데이터베이스다. (CLAUDE.md 절대규칙 2)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/todolist_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate=info
logging.level.org.hibernate.SQL=debug

# --- 시간대: 서버/DB 모두 UTC 로 저장한다. (CLAUDE.md 4장) ---
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Actuator ---
# 헬스체크만 노출한다. env/beans/heapdump 등이 열리면 내부 정보가 유출된다.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
