# 운영 프로파일 전용 오버라이드. Phase 11(AWS 배포) 전까지는 실사용되지 않는다.
# application.properties의 공통 설정(datasource URL 패턴, actuator 등)은 프로파일 병합으로 그대로 적용되므로 여기서는 다시 적지 않는다.

# --- 리버스 프록시(CloudFront) 뒤에서 실행됨 ---
# 오리진(:8080)은 평문 HTTP만 쓰고 TLS 종단은 CloudFront가 담당한다.
# forward-headers-strategy=framework는 표준 X-Forwarded-* 헤더가 있을 때를 위해 남겨둔다
# (해가 되지 않고, 다른 리버스 프록시로 바뀌면 도움이 될 수 있다).
server.forward-headers-strategy=framework

# --- OAuth2 redirect-uri 스킴 고정 ---
# 2026-09-10 실측: CloudFront는 X-Forwarded-Proto를 오리진에 전달하지 않고 무조건
# 제거하며, CloudFront-Forwarded-Proto도 캐시 정책에서 별도로 "헤더 기반 캐싱"을
# 설정해야만 붙는데 관리형 CachingDisabled 정책은 그 설정 자체가 불가능하다(AWS
# 공식 문서 RequestAndResponseBehaviorCustomOrigin·header-caching으로 확인).
# 그 결과 request.getScheme()으로 baseScheme을 추론하는 어떤 방법도 이 배포에서는
# 통하지 않는다 — 대신 이 배포의 Viewer Protocol Policy가 "Redirect HTTP to HTTPS"
# 라서 CloudFront를 거친 요청은 항상 뷰어 입장에서 HTTPS였음이 보장되므로, 스킴을
# https로 직접 고정한다. {baseScheme} 대신 리터럴 https를 쓴 것 외에는
# application.properties의 기본 템플릿과 동일하다.
spring.security.oauth2.client.registration.google.redirect-uri=https://{baseHost}{basePort}{basePath}/login/oauth2/code/{registrationId}

# --- JPA / Hibernate ---
# 운영에서는 애플리케이션이 스키마를 만들지 않는다. DDL은 CLAUDE.md 4장 절차대로 수동 적용 후 이 값으로 고정한다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
logging.level.org.hibernate=warn
logging.level.org.hibernate.SQL=warn

# --- Refresh Token 쿠키 ---
# 원칙은 SameSite=None + Secure(운영은 Amplify 도메인 ↔ API 도메인이 cross-site).
# CloudFront가 HTTPS 종단을 맡은 뒤로는 기본값(true/None)을 그대로 쓰면 된다.
# 과거 nginx/HTTPS가 없던 임시 구간에는 todolist.env에 COOKIE_SECURE=false /
# COOKIE_SAME_SITE=Lax를 넣어 낮춰 검증했었다 — 지금은 지워야 정상 동작한다.
app.cookie.secure=${COOKIE_SECURE:true}
app.cookie.same-site=${COOKIE_SAME_SITE:None}

# --- 첨부 저장소 (Phase 13 — S3 전환) ---
# 운영은 로컬 디스크를 쓰지 않는다. 버킷·리전은 환경변수로 주입한다(값은 비밀이 아니지만
# 환경마다 달라질 수 있어 여기 하드코딩하지 않는다).
# 자격증명은 EC2에 부여한 IAM Role이 제공한다 — AWS_ACCESS_KEY_ID/SECRET을 env 파일에 두지 않는다.
app.storage.type=s3
app.storage.s3.bucket=${S3_BUCKET_NAME}
app.storage.s3.region=${AWS_REGION:ap-northeast-2}
