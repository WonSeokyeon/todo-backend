# JVM 메모리 옵션 전용 파일. 앱 설정(todolist.env)과 분리해 메모리 튜닝만 바꿀 때
# 비밀값이 든 파일을 건드리지 않아도 되게 한다.
#
# t2.micro(총 RAM 1GB) 기준: 힙을 512MB로 제한하고 메타스페이스·다이렉트 버퍼에도
# 상한을 둬서 OS와 (추후) nginx가 쓸 여유 메모리를 남긴다.
# 네이티브 OOM이 나면 프로세스를 즉시 종료시켜 systemd(Restart=on-failure)가 바로
# 재기동하게 한다 — 조용히 멈춰 있는 것보다 낫다.
JAVA_OPTS=-Xms256m -Xmx512m -XX:MaxMetaspaceSize=128m -XX:MaxDirectMemorySize=64m -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError
